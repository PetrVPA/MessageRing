{% extends 'base.html' %}
{% block content %}
  <h2>Восстановление пароля</h2>
  <p>Введите email, указанный при регистрации, и мы отправим ссылку для сброса.</p>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Отправить ссылку</button>
  </form>
{% endblock %}

{% extends 'product_base.html' %}

{% block content %}
<div class="container mt-5">
    <h2>Удалить получателя?</h2>
    <p>Вы уверены, что хотите удалить получателя "{{ object }}"?</p>

    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Да, удалить</button>
        <a href="{% url 'recipient_list' %}" class="btn btn-secondary">Отмена</a>
    </form>
</div>
{% endblock %}

{% extends 'product_base.html' %} <!-- Укажите имя вашего базового шаблона -->

{% block content %}
<div class="container mt-4">
    <h1>Детали получателя</h1>

    <div class="card">
        <div class="card-body">
            <h3 class="card-title">{{ recipient.full_name }}</h3>

            <p class="card-text">
                <strong>Почта:</strong>
                <!-- Используем get_status_display() для красивого вывода -->
                {{ recipient.email }}
            </p>

            <p class="card-text">
                <strong>Полное имя:</strong><br>
                {{ recipient.full_name }}
            </p>

            <p class="card-text">
                <strong>Коментарий:</strong><br>
                {{ recipient.comment }}
            </p>

        </div>
    </div>





    <div class="mt-3">
        <a href="{% url 'recipient_list' %}" class="btn btn-secondary">← Назад к списку</a>
    </div>
</div>
{% endblock %}

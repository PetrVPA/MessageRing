{% extends 'product_base.html' %} <!-- Укажите имя вашего базового шаблона -->

{% block content %}
<div class="container mt-4">
    <h1>Детали письма</h1>

    <div class="card">
        <div class="card-body">
            <strong>Тема письма:</strong><br>
            <h3 class="card-title">{{ message.subject }}</h3>



            <p class="card-text">
                <strong>Текст сообщения:</strong><br>
                {{ message.body|linebreaks }}
            </p>

            <p class="card-text">

        </div>
    </div>



    <div class="mt-3">
        <a href="{% url 'mailing_list' %}" class="btn btn-secondary">← Назад к списку</a>
    </div>
</div>
{% endblock %}
